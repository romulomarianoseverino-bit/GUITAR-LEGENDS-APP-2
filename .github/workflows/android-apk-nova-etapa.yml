name: Compilação APK — Nova Etapa

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    name: Compilar, testar e publicar APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Configurar Android SDK
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "/usr/local/lib/android/sdk/platform-tools" >> "$GITHUB_PATH"
          yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses
          /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Preparar a mesma chave permanente do fluxo oficial
        if: success()
        env:
          KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.DEBUG_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.DEBUG_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64" || { echo "::error::Segredo DEBUG_KEYSTORE_BASE64 ausente."; exit 1; }
          test -n "$STORE_PASSWORD" || { echo "::error::Segredo DEBUG_KEYSTORE_PASSWORD ausente."; exit 1; }
          test -n "$KEY_PASSWORD" || { echo "::error::Segredo DEBUG_KEY_PASSWORD ausente."; exit 1; }

          KEYSTORE_PATH="$RUNNER_TEMP/guitar-legends-permanent.jks"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          chmod 600 "$KEYSTORE_PATH"
          KEYTOOL_LOG="$RUNNER_TEMP/keytool-check.log"
          keytool -list -v -keystore "$KEYSTORE_PATH" -storepass "$STORE_PASSWORD" > "$KEYTOOL_LOG"

          mapfile -t PRIVATE_KEY_ALIASES < <(awk '
            /^Alias name: / { alias = substr($0, index($0, ": ") + 2) }
            /^Entry type: / {
              entry_type = substr($0, index($0, ": ") + 2)
              if (entry_type == "PrivateKeyEntry" && alias != "") print alias
              alias = ""
            }
          ' "$KEYTOOL_LOG")
          if [ "${#PRIVATE_KEY_ALIASES[@]}" -ne 1 ]; then
            echo "::error::A chave permanente precisa conter exatamente uma entrada de chave privada."
            exit 1
          fi

          echo "KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"
          echo "KEY_ALIAS=${PRIVATE_KEY_ALIASES[0]}" >> "$GITHUB_ENV"
          echo "STORE_PASSWORD=$STORE_PASSWORD" >> "$GITHUB_ENV"
          echo "KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
          echo "Chave permanente validada; nenhuma chave temporária será criada."

      - name: Configurar Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Executar testes unitários antes de compilar
        id: tests
        run: |
          gradle --no-daemon testDebugUnitTest \
            --tests "com.example.ExampleUnitTest" \
            --tests "com.example.ExampleRobolectricTest" \
            --tests "com.example.GuestModeAndAccountTest" \
            --tests "com.example.StudioAndHardwareTest" \
            --tests "com.example.ReconstructedFeaturesTest"

      - name: Compilar APK assinado com a chave permanente
        id: release_build
        if: success()
        run: gradle --no-daemon assembleRelease

      - name: Publicar APK assinado
        if: success() && steps.release_build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: Guitar-Legends-APK-release
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14

