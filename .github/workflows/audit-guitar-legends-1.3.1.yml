name: Auditoria Guitar Legends 1.3.1

on:
  push:
    branches:
      - development/guitar-legends-1.3.1-audit-2026-11-27
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: Testes automatizados com Firebase Emulator
    runs-on: ubuntu-22.04
    timeout-minutes: 50
    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Configurar Android SDK
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "/usr/local/lib/android/sdk/platform-tools" >> "$GITHUB_PATH"
          yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses
          /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Configurar Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Instalar Firebase CLI
        run: npm install --global firebase-tools@15.37.0

      - name: Executar todos os testes automatizados
        run: |
          firebase emulators:exec --project demo-no-project --only auth,firestore \
            'gradle --no-daemon testDebugUnitTest --stacktrace'

      # Usa a chave permanente e confere o certificado extraído do APK 1.3 original.
      - name: Preparar chave permanente de assinatura
        id: prepare_signing
        if: success()
        env:
          GH_SIGNING_KEYSTORE_B64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
          GH_SIGNING_STORE_PASSWORD: ${{ secrets.DEBUG_KEYSTORE_PASSWORD }}
          GH_SIGNING_KEY_PASSWORD: ${{ secrets.DEBUG_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$GH_SIGNING_KEYSTORE_B64" || { echo "::error::O segredo DEBUG_KEYSTORE_BASE64 está vazio ou indisponível."; exit 1; }
          test -n "$GH_SIGNING_STORE_PASSWORD" || { echo "::error::O segredo DEBUG_KEYSTORE_PASSWORD está vazio ou indisponível."; exit 1; }
          test -n "$GH_SIGNING_KEY_PASSWORD" || { echo "::error::O segredo DEBUG_KEY_PASSWORD está vazio ou indisponível."; exit 1; }

          KEYSTORE_PATH="$RUNNER_TEMP/guitar-legends-permanent.jks"
          printf '%s' "$GH_SIGNING_KEYSTORE_B64" | base64 --decode > "$KEYSTORE_PATH"
          chmod 600 "$KEYSTORE_PATH"
          KEYTOOL_LOG="$RUNNER_TEMP/keytool-check.log"
          keytool -list -v -keystore "$KEYSTORE_PATH" -storepass "$GH_SIGNING_STORE_PASSWORD" > "$KEYTOOL_LOG"

          mapfile -t PRIVATE_KEY_ALIASES < <(awk '
            /^Alias name: / { alias = substr($0, index($0, ": ") + 2) }
            /^Entry type: / {
              entry_type = substr($0, index($0, ": ") + 2)
              if (entry_type == "PrivateKeyEntry" && alias != "") print alias
              alias = ""
            }
          ' "$KEYTOOL_LOG")
          if [ "${#PRIVATE_KEY_ALIASES[@]}" -ne 1 ]; then
            echo "::error::A chave permanente precisa conter exatamente uma entrada de chave privada."
            exit 1
          fi

          echo "KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"
          echo "KEY_ALIAS=${PRIVATE_KEY_ALIASES[0]}" >> "$GITHUB_ENV"
          echo "STORE_PASSWORD=$GH_SIGNING_STORE_PASSWORD" >> "$GITHUB_ENV"
          echo "KEY_PASSWORD=$GH_SIGNING_KEY_PASSWORD" >> "$GITHUB_ENV"
          echo "Chave permanente reconhecida. Nenhuma chave temporária será criada."

      - name: Compilar APK de validação com a chave permanente
        id: build_release
        if: success() && steps.prepare_signing.outcome == 'success'
        run: gradle --no-daemon clean assembleRelease

      - name: Validar certificado original, alinhamento e identificação
        id: validate_apk
        if: success() && steps.build_release.outcome == 'success'
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          "$BUILD_TOOLS/apksigner" verify --verbose "$APK"
          "$BUILD_TOOLS/apksigner" verify --print-certs "$APK" > "$RUNNER_TEMP/apk-certificates.txt"
          cat "$RUNNER_TEMP/apk-certificates.txt"
          EXPECTED_CERT_SHA256="3d026d2a62e1b4e8dd319b056c1c03cd77dcd34fe7fc1bcf2da69e6701558fe9"
          grep -Eiq "certificate SHA-256 digest: *$EXPECTED_CERT_SHA256" "$RUNNER_TEMP/apk-certificates.txt" || {
            echo "::error::O certificado do APK 1.3.1 não corresponde ao certificado do APK 1.3 original."
            exit 1
          }
          "$BUILD_TOOLS/zipalign" -c -v 4 "$APK"
          BADGING="$("$BUILD_TOOLS/aapt" dump badging "$APK" | head -n 1)"
          echo "$BADGING"
          echo "$BADGING" | grep -q "package: name='com.aistudio.applet.kpfcic'"
          echo "$BADGING" | grep -q "versionName='1.3.1'"
          sha256sum "$APK"

      - name: Publicar APK candidato para inspeção (não é liberação)
        if: success() && steps.validate_apk.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: guitar-legends-1.3.1-candidato-nao-liberado
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14

      - name: Instalar e abrir no emulador Android 16
        if: success() && steps.validate_apk.outcome == 'success'
        uses: reactivecircus/android-emulator-runner@v2
        env:
          ANDROID_I_WANT_MY_TCG: "yes"
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          cores: 2
          ram-size: 2048M
          heap-size: 512M
          disable-animations: true
          emulator-boot-timeout: 1800
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -no-snapshot -wipe-data
          script: |
            python3 - <<'PY'
            import os, subprocess, sys, time
            def run(args, check=True):
                p = subprocess.run(args, text=True, stdout=subprocess.PIPE, stderr=subprocess.STDOUT)
                print(p.stdout, flush=True)
                if check and p.returncode:
                    raise SystemExit(p.returncode)
                return p.stdout.strip()
            run(["adb", "wait-for-device"])
            booted = False
            for _ in range(90):
                if run(["adb", "shell", "getprop", "sys.boot_completed"], False) == "1":
                    booted = True
                    break
                time.sleep(2)
            if not booted:
                run(["adb", "devices", "-l"], False)
                raise SystemExit("Emulador não concluiu a inicialização.")
            apk = "app/build/outputs/apk/release/app-release.apk"
            installed = False
            for attempt in range(1, 4):
                print(f"Tentativa de instalação {attempt}/3", flush=True)
                if subprocess.run(["adb", "install", "--no-streaming", "-r", apk]).returncode == 0:
                    installed = True
                    break
                run(["adb", "devices", "-l"], False)
                time.sleep(5)
            if not installed:
                run(["adb", "logcat", "-d", "-t", "500"], False)
                raise SystemExit("Não foi possível instalar o APK no emulador.")
            run(["adb", "logcat", "-c"])
            run(["adb", "shell", "monkey", "-p", "com.aistudio.applet.kpfcic", "1"])
            time.sleep(20)
            pid = run(["adb", "shell", "pidof", "com.aistudio.applet.kpfcic"], False)
            log = run(["adb", "logcat", "-d", "-t", "2000"], False)
            print("=== Registros de falha do Android ===", flush=True)
            terms = ("FATAL EXCEPTION", "AndroidRuntime", "Fatal signal", "tombstone", "Process: com.aistudio.applet.kpfcic", "am_crash", "am_anr")
            matches = [line for line in log.splitlines() if any(term.lower() in line.lower() for term in terms)]
            print("\n".join(matches[-200:]), flush=True)
            with open(os.path.join(os.environ["RUNNER_TEMP"], "android-runtime-errors.log"), "w") as out:
                out.write(log)
            if not pid:
                raise SystemExit("O processo do Guitar Legends não permaneceu ativo após 20 segundos.")
            crash_markers = ("FATAL EXCEPTION", "Fatal signal", "am_crash", "am_anr")
            detected = [marker for marker in crash_markers if marker.lower() in log.lower()]
            if detected:
                raise SystemExit("Falha/crash detectado no Android: " + ", ".join(detected))
            print(f"Processo ativo após 20 segundos: {pid}", flush=True)
            PY

      - name: Publicar registros de execução do Android
        if: always() && steps.validate_apk.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: registros-android-16-1.3.1
          path: ${{ runner.temp }}/android-runtime-errors.log
          if-no-files-found: warn
          retention-days: 14

      - name: Publicar relatórios de testes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorios-auditoria-1.3.1
          path: |
            app/build/reports/tests/testDebugUnitTest/**
            app/build/test-results/testDebugUnitTest/**
          if-no-files-found: warn
          retention-days: 14
