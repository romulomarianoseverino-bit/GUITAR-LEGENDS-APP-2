name: Auditoria Guitar Legends 1.3.1

on:
  push:
    branches:
      - development/guitar-legends-1.3.1-audit-2026-11-27
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: Testes automatizados com Firebase Emulator
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Configurar Android SDK
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "/usr/local/lib/android/sdk/platform-tools" >> "$GITHUB_PATH"
          yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses
          /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Configurar Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Instalar Firebase CLI
        run: npm install --global firebase-tools@15.37.0

      - name: Executar todos os testes automatizados
        run: |
          firebase emulators:exec --project demo-no-project --only auth,firestore \
            'gradle --no-daemon testDebugUnitTest --stacktrace'

      # Usa exatamente a chave permanente já utilizada pelo fluxo oficial do projeto.
      # Se os segredos estiverem ausentes ou inválidos, não gera APK com outra assinatura.
      - name: Preparar chave permanente de assinatura
        id: prepare_signing
        if: success()
        env:
          GH_SIGNING_KEYSTORE_B64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
          GH_SIGNING_STORE_PASSWORD: ${{ secrets.DEBUG_KEYSTORE_PASSWORD }}
          GH_SIGNING_KEY_PASSWORD: ${{ secrets.DEBUG_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$GH_SIGNING_KEYSTORE_B64" || { echo "::error::O segredo DEBUG_KEYSTORE_BASE64 está vazio ou indisponível."; exit 1; }
          test -n "$GH_SIGNING_STORE_PASSWORD" || { echo "::error::O segredo DEBUG_KEYSTORE_PASSWORD está vazio ou indisponível."; exit 1; }
          test -n "$GH_SIGNING_KEY_PASSWORD" || { echo "::error::O segredo DEBUG_KEY_PASSWORD está vazio ou indisponível."; exit 1; }

          KEYSTORE_PATH="$RUNNER_TEMP/guitar-legends-permanent.jks"
          printf '%s' "$GH_SIGNING_KEYSTORE_B64" | base64 --decode > "$KEYSTORE_PATH"
          chmod 600 "$KEYSTORE_PATH"
          KEYTOOL_LOG="$RUNNER_TEMP/keytool-check.log"
          keytool -list -v -keystore "$KEYSTORE_PATH" -storepass "$GH_SIGNING_STORE_PASSWORD" > "$KEYTOOL_LOG"

          mapfile -t PRIVATE_KEY_ALIASES < <(awk '
            /^Alias name: / { alias = substr($0, index($0, ": ") + 2) }
            /^Entry type: / {
              entry_type = substr($0, index($0, ": ") + 2)
              if (entry_type == "PrivateKeyEntry" && alias != "") print alias
              alias = ""
            }
          ' "$KEYTOOL_LOG")
          if [ "${#PRIVATE_KEY_ALIASES[@]}" -ne 1 ]; then
            echo "::error::A chave permanente precisa conter exatamente uma entrada de chave privada."
            exit 1
          fi

          echo "KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"
          echo "KEY_ALIAS=${PRIVATE_KEY_ALIASES[0]}" >> "$GITHUB_ENV"
          echo "STORE_PASSWORD=$GH_SIGNING_STORE_PASSWORD" >> "$GITHUB_ENV"
          echo "KEY_PASSWORD=$GH_SIGNING_KEY_PASSWORD" >> "$GITHUB_ENV"
          echo "Chave permanente reconhecida. Nenhuma chave temporária será criada."

      - name: Compilar APK de validação com a chave permanente
        id: build_release
        if: success() && steps.prepare_signing.outcome == 'success'
        run: gradle --no-daemon clean assembleRelease

      - name: Validar assinatura, alinhamento e identificação do APK
        if: success() && steps.build_release.outcome == 'success'
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          "$BUILD_TOOLS/apksigner" verify --verbose "$APK"
          "$BUILD_TOOLS/zipalign" -c -v 4 "$APK"
          BADGING="$("$BUILD_TOOLS/aapt" dump badging "$APK" | head -n 1)"
          echo "$BADGING"
          echo "$BADGING" | grep -q "package: name='com.aistudio.applet.kpfcic'"
          echo "$BADGING" | grep -q "versionName='1.3.1'"
          sha256sum "$APK"

      - name: Instalar e abrir no emulador Android 16
        if: success() && steps.build_release.outcome == 'success'
        uses: reactivecircus/android-emulator-runner@v2
        env:
          ANDROID_I_WANT_MY_TCG: "yes"
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          cores: 4
          ram-size: 2048M
          heap-size: 512M
          disable-animations: true
          emulator-boot-timeout: 1200
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect
          script: |
            set -eu
            adb install app/build/outputs/apk/release/app-release.apk
            adb shell monkey -p com.aistudio.applet.kpfcic 1
            sleep 20
            adb shell pidof com.aistudio.applet.kpfcic
            RUNTIME_LOG="$RUNNER_TEMP/android-runtime-errors.log"
            adb logcat -d -s AndroidRuntime:E > "$RUNTIME_LOG"
            python3 -c 'from pathlib import Path; import sys; p=Path(sys.argv[1]); data=p.read_text(errors="replace"); print(data); sys.exit(1 if "FATAL EXCEPTION" in data else 0)' "$RUNTIME_LOG"

      - name: Publicar relatórios de testes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorios-auditoria-1.3.1
          path: |
            app/build/reports/tests/testDebugUnitTest/**
            app/build/test-results/testDebugUnitTest/**
          if-no-files-found: warn
          retention-days: 14
